aid: energaia
name: EnerGaia
description: >-
  EnerGaia is a spirulina producer, incorporated in Thailand in April 2009 and now headquartered
  in Singapore, that grows nutrient-dense microalgae in proprietary closed bioreactors rather than
  open ponds to deliver clean, consistent spirulina for food and beverage manufacturers. The
  company originated from research into using microalgae to capture industrial CO2 from power-plant
  flue gas and has since focused on making spirulina a mainstream, sustainable food ingredient. Its
  product line includes Fresh Spirulina Paste, Fresh-Frozen Spirulina, and Freeze-Dried Spirulina
  Powder, used in beverages, egg substitutes, noodles, meat replacements, pastas, and snacks.
  EnerGaia is a portfolio company of 500 Global. It publishes no public API, developer portal, or
  technical documentation; this profile is maintained as a company record in the API Evangelist
  network.
